server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml # Tracks which logs have been read

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape job for ACTIVE LOGS
  - job_name: ghost_active_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ghost
          log_type: active
          __path__: /var/log/ghost/active/ghost-*.log*

    # Parse the JSON log line payload format created by Winston
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339
