# Promtail ConfigMap — scrapes active/*.log and parses Winston JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: log-rotating
  labels:
    app: promtail
data:
  config.yml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: warn

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.log-rotating.svc.cluster.local:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576       # 1MB batch size for throughput

    scrape_configs:
      - job_name: ghost-active-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: ghost
              log_type: active
              __path__: /var/log/ghost/active/log-*
        pipeline_stages:
          - json:
              expressions:
                timestamp: timestamp
                level: level
                message: message
          - timestamp:
              source: timestamp
              format: RFC3339
          - labels:
              level:
---
# Promtail DaemonSet — runs on every node, mounts host log directory
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: log-rotating
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          args:
            - -config.file=/etc/promtail/config.yml
          ports:
            - containerPort: 3101
              name: http
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: ghost-active-logs
              mountPath: /var/log/ghost/active
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: ghost-active-logs
          hostPath:
            path: /mnt/ghost-logs/active    # Minikube mount point
            type: DirectoryOrCreate
        - name: positions
          emptyDir: {}
